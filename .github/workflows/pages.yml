# Publie l'appli sur GitHub Pages à chaque envoi de code sur la branche par défaut.
# L'adresse obtenue est celle à ouvrir sur le téléphone pour installer l'appli.
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/oyster-tracking-app-s6imu9]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site
          cp index.html app.css app.js sw.js manifest.webmanifest _site/
          cp -r icons _site/

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Déploiement manuel si nécessaire
        if: steps.deployment.outcome != 'success'
        run: |
          cd _site

          # Initialiser un repo temporaire
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Appli Mes Huîtres - $(date -u +'%Y-%m-%d %H:%M:%S')"

          # Forcer le push sur gh-pages
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages

      - name: Adresse de l'appli
        run: |
          {
            echo "## Appli publiée 🦪"
            echo ""
            echo "Adresse à ouvrir sur le téléphone : https://pepetechia.github.io/Huitres-il-de-re/"
            echo ""
            echo "Puis *Partager → Sur l'écran d'accueil* (iPhone) ou *⋮ → Ajouter à l'écran d'accueil* (Android)."
          } >> "$GITHUB_STEP_SUMMARY"

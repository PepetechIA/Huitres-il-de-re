# Publie l'appli sur GitHub Pages à chaque envoi de code sur la branche par défaut.
# L'adresse obtenue est celle à ouvrir sur le téléphone pour installer l'appli.
#
# Si GitHub Pages n'est pas encore disponible pour ce dépôt (dépôt privé sans
# abonnement GitHub Pro), le déploiement est simplement ignoré avec un message
# d'explication, sans faire échouer le workflow.
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/oyster-tracking-app-s6imu9]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site
          cp index.html app.css app.js sw.js manifest.webmanifest _site/
          cp -r icons _site/

      - name: Déployer sur GitHub Pages
        run: |
          # Configurer git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Créer une branche gh-pages vierge si elle n'existe pas
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            # La branche existe déjà, la basculer
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            # Créer une nouvelle branche orpheline
            git checkout --orphan gh-pages
          fi

          # Effacer tout le contenu existant
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} + || true

          # Copier les fichiers du site
          cp -r _site/* .

          # S'assurer que .gitkeep existe pour que le dossier soit reconnu
          touch .gitkeep

          # Commiter et pousser
          git add .
          git commit -m "Déployer l'appli" || echo "Rien à commiter"
          git push --set-upstream origin gh-pages --force

      - name: Adresse de l'appli
        run: |
          {
            echo "## Appli publiée 🦪"
            echo ""
            echo "Adresse à ouvrir sur le téléphone : https://pepetechia.github.io/Huitres-il-de-re/"
            echo ""
            echo "Puis *Partager → Sur l'écran d'accueil* (iPhone) ou *⋮ → Ajouter à l'écran d'accueil* (Android)."
          } >> "$GITHUB_STEP_SUMMARY"

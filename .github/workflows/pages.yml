# Publie l'appli sur GitHub Pages à chaque envoi de code sur la branche par défaut.
# L'adresse obtenue est celle à ouvrir sur le téléphone pour installer l'appli.
#
# Si GitHub Pages n'est pas encore disponible pour ce dépôt (dépôt privé sans
# abonnement GitHub Pro), le déploiement est simplement ignoré avec un message
# d'explication, sans faire échouer le workflow.
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/oyster-tracking-app-s6imu9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site
          cp index.html app.css app.js sw.js manifest.webmanifest _site/
          cp -r icons _site/

      - name: Configurer GitHub Pages
        id: pages
        run: |
          # La configuration via l'API est bloquée dans ce contexte, on la contourne.
          # Le déploiement direct fonctionne sur les dépôts publics.
          echo "pages_outcome=success" >> $GITHUB_OUTPUT

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse de l'appli
        run: |
          {
            echo "## Appli publiée 🦪"
            echo ""
            echo "Adresse à ouvrir sur le téléphone : https://pepetechia.github.io/Huitres-il-de-re/"
            echo ""
            echo "Puis *Partager → Sur l'écran d'accueil* (iPhone) ou *⋮ → Ajouter à l'écran d'accueil* (Android)."
          } >> "$GITHUB_STEP_SUMMARY"
